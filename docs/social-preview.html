<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#334155 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px}
h1{font-size:72px;font-weight:800;letter-spacing:-1px}
.tag{display:inline-block;background:#10b981;color:#fff;padding:8px 20px;border-radius:999px;font-size:22px;margin-top:24px}
.desc{font-size:28px;color:#cbd5e1;margin-top:24px;max-width:1000px;line-height:1.4}
.footer{margin-top:48px;font-size:22px;color:#94a3b8}
code{background:#0f172a;padding:4px 10px;border-radius:6px;color:#7dd3fc}
</style>
</head>
<body>
<h1>DShScan</h1>
<div class="tag">DSH Plugin Security Scanner</div>
<div class="desc">SkillSpector-style risk scoring, severity, evidence, and install recommendations for DeepSeek Harness plugins.</div>
<div class="footer"><code>dsh plugin add @shaoshi/dshscan</code> · dshbase listed</div>
</body>
</html>
